[project]
name = "pollen-api"
version = "0.1.0"
description = "Korea pollen forecast and morning alerts — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ariadne>=0.23",
    "beanie>=1.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[project.scripts]
pollen-job = "pollen.scripts.run_job:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pollen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# SIM simplify, N naming, ASYNC async-correctness.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# One long line inside an embedded HTML string.
"**/sign.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
