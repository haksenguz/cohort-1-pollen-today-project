# Slice C — Alerts & Delivery. Owner: Ismoiljon.

"One alert that was delivered to a public Telegram channel."
type Alert {
  id: ObjectId!
  region: Region!
  pollenType: PollenType!
  "The day the alert is about, not the day it was sent."
  targetDate: String!
  riskLevel: RiskLevel!
  channel: String!
  sentAt: DateTime!
  messageText: String!
}

type PaginatedAlert {
  items: [Alert!]!
  total: Int!
  hasMore: Boolean!
}

extend type Query {
  alertHistory(
    region: Region
    limit: Int! = 50
    offset: Int! = 0
  ): PaginatedAlert!
}
