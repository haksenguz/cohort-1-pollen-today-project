# Slice A — Forecast Engine. Owner: Jamshid.

"Predicted pollen risk for a single KST calendar day."
type ForecastDay {
  "YYYY-MM-DD, KST."
  date: String!
  riskLevel: RiskLevel!
  "0–1. Null for the persistence baseline, which does not produce one."
  confidence: Float
}

"Three-day forecast. Beyond three days is out of scope — accuracy collapses."
type Forecast {
  region: Region!
  pollenType: PollenType!
  days: [ForecastDay!]!
  "e.g. \"baseline-persistence-v1\" or \"gbm-v3\". Never omitted."
  modelVersion: String!
  generatedAt: DateTime!
}

extend type Query {
  forecast(region: Region!, pollenType: PollenType! = WEEDS): Forecast!
}
