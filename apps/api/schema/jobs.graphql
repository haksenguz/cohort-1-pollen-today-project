# Scheduled job instrumentation. Owner: Ismoiljon (Slice C).
#
# Every scheduled job in the system writes a JobRun, whichever slice owns the
# job itself. That is why this is its own component rather than living inside
# alerts.

"One execution of a scheduled job."
type JobRun {
  jobName: String!
  startedAt: DateTime!
  finishedAt: DateTime
  status: JobStatus!
  "Rows written or messages sent. Null while still running."
  rowsAffected: Int
  error: String
}

"Ops status page. Stale when any job has not succeeded in over 26 hours."
type SystemStatus {
  "The most recent run of each job, one row per job name."
  jobs: [JobRun!]!
  stale: Boolean!
}

extend type Query {
  systemStatus: SystemStatus!
}
