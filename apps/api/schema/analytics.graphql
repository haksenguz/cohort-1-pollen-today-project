# Slice B — Season Analytics. Owner: Giyos.

"One pollen season, for one region and one year."
type SeasonWindow {
  year: Int!
  region: Region!
  pollenType: PollenType!
  startDate: String!
  endDate: String!
  lengthDays: Int!
}

"Season timing across years — has the season shifted?"
type SeasonTiming {
  region: Region!
  pollenType: PollenType!
  seasons: [SeasonWindow!]!
  "Days per year. Positive means the season is lengthening."
  lengthTrendDaysPerYear: Float
}

extend type Query {
  seasonTiming(region: Region!, pollenType: PollenType! = WEEDS): SeasonTiming!
}
