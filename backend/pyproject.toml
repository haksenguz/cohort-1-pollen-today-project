[project]
name = "allergy-ai-backend"
version = "0.1.0"
description = "Allergy AI Companion — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "alembic>=1.13",
    "langgraph>=0.2",
    "openai>=1.50",
    "pwdlib[bcrypt]>=0.2.1",
    "pyjwt>=2.9",
    "greenlet>=3.5.5",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
