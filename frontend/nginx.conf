server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # A chat turn with a triage engine and a tool call can legitimately hold the
    # connection open. The default 60s read timeout cuts it off mid-answer.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # ---- Server-sent events: /api/chat streams -------------------
        # These four are the difference between a working chat and one that
        # looks frozen and then dumps the whole answer at once. nginx buffers
        # proxied responses by default, and a buffered SSE stream is not SSE.
        proxy_buffering off;
        proxy_cache off;
        gzip off;                      # gzip buffers, which defeats the above
        chunked_transfer_encoding on;
        proxy_set_header Connection "";  # not keep-alive: SSE is long-lived

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # Hashed asset filenames, so they may be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell and the service worker must never be cached hard, or a client
    # keeps booting the previous build and the PWA update prompt never fires.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: /today and /chat are real routes with no file behind
    # them, so they have to fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}