name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # The contract freeze, mechanically enforced: regenerate the types from
      # the hand-written SDL and fail if they differ from what is committed. A
      # .graphql change cannot land without its generated types in the same PR.
      - name: Generated GraphQL types are up to date
        run: |
          pnpm --filter @pollen/api schema:generate
          git diff --exit-code apps/api/src/graphql.generated.ts
