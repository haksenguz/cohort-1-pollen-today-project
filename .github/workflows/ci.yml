name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest

    # Integration tests run against a real MongoDB on purpose: the idempotency
    # guarantee is that the DATABASE refuses a duplicate, and a mock that
    # accepts two identical inserts would pass a test that proves nothing.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/pollen
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/pollen_test
        run: uv run pytest -q

  web:
    name: Web + contracts (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # The contract freeze, mechanically enforced: regenerate the TypeScript
      # types from the hand-written SDL and fail if they differ from what is
      # committed. A .graphql change cannot land without its generated types in
      # the same pull request.
      - name: Generated types are up to date
        run: |
          pnpm --filter @pollen/contracts generate
          git diff --exit-code packages/contracts/src/graphql.ts
